name: Refresh content

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor
        run: pip install --quiet "trafilatura>=2.0" lxml_html_clean

      - name: Fetch feeds and article text
        env:
          FETCH_BUDGET: "150"
        run: python ingest/ingest.py

      - name: Commit what changed
        run: |
          git config user.name "curated-bot"
          git config user.email "curated-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Content refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
